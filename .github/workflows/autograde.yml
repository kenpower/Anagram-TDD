name: Autograde

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build (MSBuild) and run tests
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Restore NuGet packages
      run: |
        nuget restore "Anagram-TDD/AnagramTDD.sln"
      shell: cmd

    - name: Build solution (Release|x64)
      run: |
        msbuild "Anagram-TDD/AnagramTDD.sln" /p:Configuration=Release /p:Platform=x64 /m
      shell: cmd

    - name: Run tests and collect gtest XML
      run: |
        if exist "Anagram-TDD/x64/Release/Anagram-TDD.exe" (
          Anagram-TDD/x64/Release/Anagram-TDD.exe --gtest_output=xml:results.xml
        ) else (
          echo "Executable not found: Anagram-TDD/x64/Release/Anagram-TDD.exe" & dir Anagram-TDD & dir Anagram-TDD/x64 & exit 1
        )
      shell: cmd

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: results.xml
