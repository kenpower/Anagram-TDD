name: Autograde

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build (MSBuild) and run tests
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Restore NuGet packages
      run: |
        nuget restore "Anagram-TDD/AnagramTDD.sln"
      shell: cmd

    - name: Build solution (Release|x64)
      run: |
        msbuild "Anagram-TDD/AnagramTDD.sln" /p:Configuration=Release /p:Platform=x64 /m
      shell: cmd

    - name: Run tests and collect gtest XML
      run: |
        if exist "Anagram-TDD\\x64\\Release\\Anagram-TDD.exe" (
          "Anagram-TDD\\x64\\Release\\Anagram-TDD.exe" --gtest_output=xml:results.xml
        ) else (
          echo "Executable not found: Anagram-TDD\\x64\\Release\\Anagram-TDD.exe" & dir Anagram-TDD & dir Anagram-TDD\\x64 & exit 1
        )
      shell: cmd

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: results.xml

    - name: Update README badge with test results
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        Write-Host "Parsing results.xml and updating README badge"
        $xml = [xml](Get-Content results.xml)
        $tests = 0
        $failures = 0
        if ($xml.testsuites -ne $null) {
          $tests = [int]$xml.testsuites.tests
          $failures = [int]$xml.testsuites.failures
        } else {
          # Fallback: try testsuite element
          $ts = $xml.testsuite
          if ($ts -ne $null) {
            $tests = [int]$ts.tests
            $failures = [int]$ts.failures
          }
        }
        $passed = $tests - $failures
        if ($tests -eq 0) { $color = 'lightgrey' } elseif ($passed -eq $tests) { $color = 'brightgreen' } elseif ($passed -gt 0) { $color = 'yellow' } else { $color = 'red' }
        $message = "$passed/$tests"
        $label = "tests"
        $badge_url = "https://img.shields.io/badge/$label-$([System.Uri]::EscapeDataString($message))-$color"
        $badge_md = "![tests]($badge_url)"
        $readme = 'readme.md'
        if (-Not (Test-Path $readme)) {
          Write-Host "README not found at $readme, creating new file"
          @"
<!-- TEST_BADGE_START -->
$badge_md
<!-- TEST_BADGE_END -->

# TDD Exercise: "Anagram Detector"
"@ | Out-File -FilePath $readme -Encoding utf8
        } else {
          $text = Get-Content $readme -Raw -Encoding utf8
          if ($text -match '<!-- TEST_BADGE_START -->[\s\S]*?<!-- TEST_BADGE_END -->') {
            $new = [System.Text.RegularExpressions.Regex]::Replace($text, '<!-- TEST_BADGE_START -->[\s\S]*?<!-- TEST_BADGE_END -->', "<!-- TEST_BADGE_START -->`n$badge_md`n<!-- TEST_BADGE_END -->")
            $new | Out-File -FilePath $readme -Encoding utf8
          } else {
            # Prepend badge
            $prefix = @"
<!-- TEST_BADGE_START -->
$badge_md
<!-- TEST_BADGE_END -->

"@
            ($prefix + $text) | Out-File -FilePath $readme -Encoding utf8
          }
        }
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git add $readme
        git commit -m "ci: update test badge ($passed/$tests)" || Write-Host "No changes to commit"
        git push
      shell: pwsh
