name: Autograde

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build (MSBuild) and run tests
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Restore NuGet packages
      run: |
        nuget restore "Anagram-TDD.sln"
      shell: cmd

    - name: Build solution (Release|x64)
      run: |
        msbuild "Anagram-TDD.sln" /p:Configuration=Release /p:Platform=x64 /m
      shell: cmd

    - name: Run tests and collect gtest XML
      continue-on-error: true
      shell: pwsh
      run: |
        $exe = Join-Path "$PWD" "x64\Release\Anagram-TDD.exe"
        if (Test-Path $exe) {
          Write-Host "Running tests: $exe"
          & $exe --gtest_output=xml:results.xml
          $rc = $LASTEXITCODE
          Write-Host "Raw exit code: $rc"
          # If gtest didn't produce XML, create a minimal results.xml using the exit code
          if (-not (Test-Path "$PWD\results.xml")) {
            $tests = 0; $fails = 0
            if ($rc -ne 0) { $tests = 1; $fails = 1 };
            $xml = "<testsuites tests=\"$tests\" failures=\"$fails\"></testsuites>"
            Set-Content -Path "$PWD\results.xml" -Value $xml
            Write-Host "Created fallback results.xml (tests=$tests failures=$fails)"
          }
        } else {
          Write-Host "Executable not found: $exe"
          $rc = 1
        }
        Write-Host "Test exit code: $rc"
        Set-Content -Path test_exit_code.txt -Value $rc

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: results.xml

    - name: Update README badge (safe Node)
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const xmlPath = 'results.xml';
          let xml = '';
          if (fs.existsSync(xmlPath)) {
            xml = fs.readFileSync(xmlPath, 'utf8');
          }
          let tests = 0, failures = 0;
          if (xml) {
            let m = xml.match(/<testsuites[^>]*tests="(\d+)"[^>]*failures="(\d+)"[^>]*>/);
            if (!m) m = xml.match(/<testsuite[^>]*tests="(\d+)"[^>]*failures="(\d+)"[^>]*>/);
            if (m) { tests = parseInt(m[1], 10); failures = parseInt(m[2], 10); }
          } else if (fs.existsSync('test_exit_code.txt')) {
            // No XML produced; fall back to exit code. If non-zero, mark as 1 failure on 1 test.
            const rc = parseInt(fs.readFileSync('test_exit_code.txt','utf8').trim() || '0', 10);
            if (rc !== 0) { tests = 1; failures = 1; } else { tests = 0; failures = 0; }
          }
          const passed = tests - failures;
          const color = (tests === 0) ? 'lightgrey' : (passed === tests) ? 'brightgreen' : (passed > 0) ? 'yellow' : 'red';
          const message = `${passed}/${tests}`;
          const badgeUrl = `https://img.shields.io/badge/${encodeURIComponent('tests passed')}-${encodeURIComponent(message)}-${color}`;
          const badgeMd = `![tests passed](${badgeUrl})`;
          const readmePath = 'readme.md';
          let text = '';
          if (fs.existsSync(readmePath)) text = fs.readFileSync(readmePath, 'utf8');
          const start = '<!-- TEST_BADGE_START -->';
          const end = '<!-- TEST_BADGE_END -->';
          if (text.includes(start) && text.includes(end)) {
            const replaced = text.replace(new RegExp(`${start}[\s\S]*?${end}`), `${start}\n${badgeMd}\n${end}`);
            fs.writeFileSync(readmePath, replaced, 'utf8');
          } else {
            const header = `${start}\n${badgeMd}\n${end}\n\n`;
            const initial = text || '# TDD Exercise: "Anagram Detector"\n';
            fs.writeFileSync(readmePath, header + initial, 'utf8');
          }
          // write test status so the workflow can fail after badge update
          fs.writeFileSync('test_status.txt', String(failures), 'utf8');

    - name: Commit README badge
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git add readme.md
        git commit -m "ci: update test badge" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Fail if tests failed
      if: always()
      run: |
        failures=$(cat test_status.txt 2>/dev/null || echo 0)
        echo "Failures: $failures"
        if [ "$failures" -gt 0 ]; then
          echo "Tests failed — failing workflow after badge update"
          exit 1
        else
          echo "All tests passed"
        fi
      shell: bash

    # README badge update removed — keep CI focused on build and tests
